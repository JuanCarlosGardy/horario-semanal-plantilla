<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario Restaurante Barquilla</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-panel {
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .btn-whatsapp:hover { background-color: #128C7E; }

        .btn-print {
            background-color: #333;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .btn-print:hover { background-color: #555; }

        #horario-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 1400px; /* Un poco más ancho para dar aire */
            max-width: 100%;
            overflow-x: auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 26px;
            font-weight: 800;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            table-layout: fixed; /* Mantiene las columnas firmes */
        }

        th, td {
            border: 1px solid #ddd;
            padding: 4px;
            text-align: center;
            vertical-align: middle;
        }

        /* ESTILO NUEVO: Textarea para turnos partidos */
        textarea {
            width: 96%;
            height: 38px; /* Altura suficiente para 2 líneas cómodas */
            border: none;
            resize: none; /* Quita el tirador de la esquina */
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            font-size: 13px; /* Tamaño legible */
            line-height: 1.2; /* Separación entre líneas ajustada */
            background: transparent;
            overflow: hidden;
            padding-top: 4px;
        }

        textarea:focus {
            background-color: #eef;
            outline: none;
        }

        /* Mantenemos input solo para el nombre que es corto */
        input.nombre-empleado {
            width: 95%;
            border: none;
            font-weight: 800;
            text-align: left;
            padding-left: 8px;
            font-size: 14px;
            color: #2c3e50;
            text-transform: uppercase;
            background: transparent;
        }

        thead th {
            background-color: #222;
            color: white;
            padding: 10px;
            font-size: 14px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .section-header {
            text-align: left;
            padding: 8px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 15px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .sala-header { background-color: #0056b3 !important; }
        .cocina-header { background-color: #d35400 !important; }

        tbody tr:nth-child(even) { background-color: #f8f9fa; }

        .input-fecha {
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            text-align: center;
            width: 450px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        @media print {
            @page { size: landscape; margin: 0.5cm; }
            body { background: white; padding: 0; -webkit-print-color-adjust: exact; }
            .control-panel { display: none; }
            #horario-container { box-shadow: none; width: 100%; }
            textarea { font-size: 11px; } /* Ajuste para papel */
        }
    </style>
</head>

    <script>
        function descargarImagen() {
            const elemento = document.getElementById("horario-container");
            html2canvas(elemento, {
                scale: 3, // CALIDAD AUMENTADA (Se verá mucho más nítido)
                backgroundColor: "#ffffff",
                windowWidth: 1450 // Asegura que todo el texto quepa antes de la foto
            }).then(canvas => {
                const link = document.createElement("a");
                const fecha = new Date().toISOString().slice(0,10);
                link.download = `Horario-Barquilla-${fecha}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.95);
                link.click();
            });
        }
    </script>
