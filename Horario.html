    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-panel {
            margin-bottom: 20px;
            text-align: center;
        }

        button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #128C7E;
        }

        #horario-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 1350px; /* Ancho optimizado para nombres y horas largas */
            max-width: 100%;
            overflow-x: auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 26px;
            font-weight: 800;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 5px;
            text-align: center;
        }

        /* Inputs para las horas */
        input[type="text"] {
            width: 98%;
            border: none;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            background: transparent;
            padding: 4px;
        }
        
        input[type="text"]:focus {
            background-color: #eef;
            outline: none;
        }

        /* Estilo especial para la columna de Nombres */
        input.nombre-empleado {
            font-weight: 800; /* Letra más gruesa para los nombres */
            text-align: left;
            padding-left: 8px;
            font-size: 14px;
            color: #2c3e50;
            text-transform: uppercase; /* Fuerza mayúsculas visualmente */
        }

        thead th {
            background-color: #222;
            color: white;
            padding: 10px;
            font-size: 14px;
        }

        .section-header {
            text-align: left;
            padding: 8px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 15px;
        }

        /* Colores corporativos funcionales */
        .sala-header { background-color: #0056b3; } /* Azul */
        .cocina-header { background-color: #d35400; } /* Naranja */

        tbody tr:nth-child(even) { background-color: #f8f9fa; }

        .input-fecha {
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            text-align: center;
            width: 450px;
            margin-bottom: 15px;
            text-transform: uppercase;

    </style>
</head>

    <script>
        function descargarImagen() {
            const elemento = document.getElementById("horario-container");
            html2canvas(elemento, {
                scale: 2, // Alta calidad
                backgroundColor: "#ffffff",
                windowWidth: 1400 // Asegura que no se corte nada
            }).then(canvas => {
                const link = document.createElement("a");
                const fecha = new Date().toISOString().slice(0,10);
                link.download = `Horario-Barquilla-${fecha}.jpg`;
                link.href = canvas.toDataURL("image/jpeg", 0.9);
                link.click();
            });
        }
    </script>
